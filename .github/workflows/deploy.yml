name: Deploy
# Deploys run only when you start them: Actions → Deploy → Run workflow (works from the GitHub
# mobile app). That manual start is the approval gate. Tests run first; a failure stops the deploy.
# (Environment required reviewers would need a public repo or GitHub Enterprise.)
on:
  workflow_dispatch: {}
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
